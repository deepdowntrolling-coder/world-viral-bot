name: World Viral V17 BIG TEXT Amazon Only
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Pillar'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gold_silver
          - crypto
          - usa_iran
          - russia_ukraine
          - saudi_iraq_oil
          - natural_disasters
          - aviation_accidents
          - ufo_orbs
          - eu_euro
          - uk

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml
      - name: Run V17 BIG TEXT
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          PILLAR: ${{ github.event.inputs.pillar || 'auto' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py
          ls -lh
      - name: Save artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-bigtext-${{ github.run_number }}
          path: |
            world_viral_output.mp4
            script.txt
            text_overlay.png
            pexels_clip.mp4
            product_image.jpg
            voice.mp3
          if-no-files-found: warn
          retention-days: 5

