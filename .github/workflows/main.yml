name: World Viral V9 SALES 100 Categories
on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Category ID (or auto for random 100)'
        required: false
        default: 'auto'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick fonts-dejavu-core
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml
      - name: Run SALES bot V9
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          AWIN_ID: ${{ secrets.AWIN_ID }}
          PILLAR: ${{ github.event.inputs.pillar || 'auto' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py
      - name: Save artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sales-video-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            world_viral_output.mp4
            script.txt
            text_overlay.png
            pexels_clip.mp4
          retention-days: 5
